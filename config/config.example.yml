# Four-camera Frigate zone prototype.
#
# Two zones per camera, on purpose, because they answer two different questions.
# `camera_N_area` is the full normalised frame with loitering_time 0: "somebody is
# on camera". `camera_N_loitering` is the same polygon with loitering_time 60:
# "tracked in-zone presence has reached a minute". Alerts fire on the loitering
# zone, snapshots are still saved on the area zone, and the retention worker pins
# only what reached the threshold — so an ordinary walk-through ages out on the six
# hour timer and only a deliberate presence is kept until somebody deletes it.
#
# What 60 seconds measures: Frigate advances the counter on tracked frames with the
# object inside the zone, and detect.fps below is 3, so the threshold is 180
# frames. That is tracked presence, NOT continuous wall-clock time — separate visits
# by the same tracked object can accumulate toward it, and nothing here says the
# object stood still, stayed in one place, or meant anything by being there.
#
# Both polygons are the whole frame to begin with: whole-view monitoring is the
# intended initial default, so every view is covered from the first run instead of
# only the part of the scene somebody happened to outline. That is also noisier
# than anything you want to read — a full-frame loitering zone qualifies anybody
# who waits for a door, finds a key or uses a phone — so narrow both zones to the
# area you actually care about (a door, a driveway, a stairwell) in the Frigate
# zone editor at https://localhost:8971/settings. Keep the two polygons identical
# while you redraw them; they mean different things about the same place. Each
# camera keeps its own independent zones, and the eight never overlap or share
# state across cameras.
#
# This is a geometry prototype, not a judgement about danger: 60 seconds is a
# starting threshold for "this presence is worth a human look". It is not a threat
# assessment, and no model here makes one. Nothing in this file is a measured
# accuracy claim, and no walkthrough has yet been run against it.
#
# Camera streams are placeholders too. Fill .env (never this file) with the real
# RTSP URLs, passwords written raw. A camera that cannot be reached degrades on
# its own: Frigate keeps retrying that feed while the other three carry on, and
# it recovers by itself once the camera answers again. Set enabled: false on a
# camera only to remove it from the suite deliberately.

mqtt:
  enabled: false

detectors:
  ov:
    type: openvino
    device: CPU

model:
  # Must match the bundled OpenVINO tensor exactly (ssdlite_mobilenet_v2 is
  # 300x300). Changing these breaks inference; the capture size below is what
  # you tune instead.
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Detection resolution and rate for every camera. This is independent of the
# model tensor above: frames are captured at 352x288 and resized to 300x300
# before inference, so the four streams stay cheap on CPU.
detect:
  width: 352
  height: 288
  fps: 3

# go2rtc restreams the four main channels, and each camera's live: block below
# names one of them. Detection does not use these: the detect inputs further down
# stay on the low channel at 3 fps, so a browser watching a main channel cannot
# change what the detectors cost.
#
# These four URLs are the URL-encoded ones from .env, and .env says why they are
# encoded differently from the detection URLs. go2rtc substitutes them into an
# RTSP source and applies no encoder of its own. If a camera's main channel is
# unreachable, go2rtc retries it and the other three keep streaming.
go2rtc:
  streams:
    camera_1_main: ['{FRIGATE_CAMERA_1_MAIN_RTSP_URL}']
    camera_2_main: ['{FRIGATE_CAMERA_2_MAIN_RTSP_URL}']
    camera_3_main: ['{FRIGATE_CAMERA_3_MAIN_RTSP_URL}']
    camera_4_main: ['{FRIGATE_CAMERA_4_MAIN_RTSP_URL}']

cameras:
  camera_1:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_1_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    # detect width/height/fps are inherited from the global block above.
    # Add a per-camera detect: block here only to override one camera.
    objects:
      track:
        - person
    zones:
      camera_1_area:
        # Deliberate default: every part of this view counts, so no area is
        # silently unwatched. Narrow it to what you care about when you know
        # the scene. loitering_time 0 means no tracked-presence requirement at all.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 0
        objects:
          - person
      camera_1_loitering:
        # The same polygon as camera_1_area, with the rule that matters: 180
        # tracked in-zone frames at 3 fps, which is 60 seconds. Redraw this one
        # whenever you redraw the other.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 60
        objects:
          - person
    review:
      alerts:
        labels:
          - person
        # Alerts are gated on the loitering zone, so an ordinary walk-through
        # never becomes an alert. Only this zone is retained indefinitely.
        required_zones:
          - camera_1_loitering
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      # Snapshots stay on the area zone: saving an image of everybody who walks
      # past is cheap at six hours, and keeping it is what the loitering rule is
      # for.
      required_zones:
        - camera_1_area
      retain:
        # 6 hours, in days, for everything the worker has not pinned. Short on
        # purpose: the retention worker pins the events that reached the tracked
        # presence threshold, and a long window here would just hide an event the
        # worker never saw. Snapshots pinned under an older whole-frame zone rule
        # are NOT released by this — those stay until a person deletes them, so
        # only newly captured ordinary snapshots are on this timer.
        default: 0.25
    record:
      # Continuous recording stays off; this prototype keeps snapshots only.
      enabled: false
    live:
      streams:
        Main: camera_1_main

  camera_2:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_2_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
