# Four-camera Frigate zone prototype.
#
# One zone per camera, `camera_N_area`, on the full normalised frame with
# loitering_time 0: "somebody is on camera". It carries the ten COCO 91 animal
# classes on cameras 1-3 and person on all four, so every person and every watched
# animal still gets a snapshot the moment it is in frame. Snapshots stay on the
# area zone, so saving an image of everybody who walks past is cheap at six hours.
#
# There is deliberately no second zone and no alert gate here. The 60-second
# full-frame rule that used to qualify any tracked person on every camera is gone,
# and native person alerts are switched off on all four with
# `review.alerts.enabled: false`. Retention for people is now decided by
# `scripts/retain.py` and only while a person has armed entry review by hand on
# the dashboard; nothing here decides it, and nothing here fires an alert.
#
# The optional per-camera restricted area, `camera_N_restricted`, is NOT in this
# file. See docs/restricted-zone.md for one commented example and for why it is
# inactive here: the polygons are deployment-specific and are drawn in Frigate's own
# zone editor, so a generic full-frame guess would arm every frame and make the
# zone meaningless. Once a polygon exists, `retain.py` reads /api/config, sees the
# zone as person-only at loitering_time 0, and only then offers the Arm control for
# that camera. Until then the camera reads "restricted area not configured" and
# cannot be armed.
#
# What arming does and does not mean. While armed, a person inside the restricted
# area has their snapshot kept for review. That is a candidate for a person to
# look at. It is not a judgement: this model reports one class, person, so it
# cannot tell family from anyone else, and a zone cannot say which side of a
# boundary somebody came from — that needs an ordered track across frames, which
# is not built. Nothing here scores risk or intent, and nothing here detects a
# fight: the object model is COCO 91, and it has no class for one.
#
# The bundled SSDLite MobileNetV2 reads coco_91cl_bkgr.txt and knows nothing about
# harm. It reports a species; "harmful" is a judgement made afterwards, not a
# detection. Two consequences worth stating plainly:
#   - There is no rat, mouse, rodent, snake or scorpion class in COCO 91. Those are
#     not detectable here at all; they need a different model.
#   - All ten classes are tracked on these three cameras because they were asked
#     for. None of them has been seen on these feeds, so no class here is claimed to
#     be noisier or more prone to misfire than another, and the extra tracking work
#     and its effect on accuracy are both unmeasured.
# Detection runs at 352x288 and 3 fps, and an animal at the edge of a frame is far
# smaller in those pixels than a person, so misses are expected. Nothing here has
# been measured against a real animal yet, and no accuracy figure for any rule in
# this file has been measured at all.
#
# Camera streams are placeholders too. Fill .env (never this file) with the real
# RTSP URLs, passwords written raw. A camera that cannot be reached degrades on
# its own: Frigate keeps retrying that feed while the other three carry on, and
# it recovers by itself once the camera answers again. Set enabled: false on a
# camera only to remove it from the suite deliberately.

mqtt:
  enabled: false

detectors:
  ov:
    type: openvino
    device: CPU

model:
  # Must match the bundled OpenVINO tensor exactly (ssdlite_mobilenet_v2 is
  # 300x300). Changing these breaks inference; the capture size below is what
  # you tune instead.
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

# Detection resolution and rate for every camera. This is independent of the
# model tensor above: frames are captured at 352x288 and resized to 300x300
# before inference, so the four streams stay cheap on CPU.
detect:
  width: 352
  height: 288
  fps: 3

# go2rtc restreams the four main channels, and each camera's live: block below
# names one of them. Detection does not use these: the detect inputs further down
# stay on the low channel at 3 fps, so a browser watching a main channel cannot
# change what the detectors cost.
#
# These four URLs are the URL-encoded ones from .env, and .env says why they are
# encoded differently from the detection URLs. go2rtc substitutes them into an
# RTSP source and applies no encoder of its own. If a camera's main channel is
# unreachable, go2rtc retries it and the other three keep streaming.
go2rtc:
  streams:
    camera_1_main: ['{FRIGATE_CAMERA_1_MAIN_RTSP_URL}']
    camera_2_main: ['{FRIGATE_CAMERA_2_MAIN_RTSP_URL}']
    camera_3_main: ['{FRIGATE_CAMERA_3_MAIN_RTSP_URL}']
    camera_4_main: ['{FRIGATE_CAMERA_4_MAIN_RTSP_URL}']

cameras:
  camera_1:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_1_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    # detect width/height/fps are inherited from the global block above.
    # Add a per-camera detect: block here only to override one camera.
    objects:
      track:
        - person
        - bird
        - cat
        - dog
        - horse
        - sheep
        - cow
        - elephant
        - bear
        - zebra
        - giraffe
    zones:
      camera_1_area:
        # Deliberate default: every part of this view counts, so no area is
        # silently unwatched. loitering_time 0 means no tracked-presence
        # requirement at all — this zone is the snapshot trigger, not a rule.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 0
        objects:
          - person
          - bird
          - cat
          - dog
          - horse
          - sheep
          - cow
          - elephant
          - bear
          - zebra
          - giraffe
      # camera_1_restricted would go here, person-only at loitering_time 0, with a
      # polygon drawn on the real floor boundary. It is commented out everywhere,
      # not per camera, and documented once: docs/restricted-zone.md.
    review:
      alerts:
        # Native alerts are off on every camera. Retaining a person is now a
        # decision somebody makes by hand on the dashboard, not a native alert,
        # and leaving this enabled would fire on every person on every frame.
        enabled: false
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      # Snapshots stay on the area zone: saving an image of everybody who walks
      # past is cheap at six hours, and keeping it is what the arming decision is
      # for.
      required_zones:
        - camera_1_area
      retain:
        # 6 hours, in days, for everything the worker has not pinned. Short on
        # purpose: the retention worker pins the events it is allowed to, and a
        # long window here would just hide an event the worker never saw.
        # Snapshots pinned under an older rule are NOT released by this — those
        # stay until a person deletes them, so only newly captured ordinary
        # snapshots are on this timer.
        default: 0.25
    record:
      # Continuous recording stays off; this prototype keeps snapshots only.
      enabled: false
    live:
      streams:
        Main: camera_1_main

  camera_2:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_2_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    # detect width/height/fps are inherited from the global block above.
    objects:
      track:
        - person
        - bird
        - cat
        - dog
        - horse
        - sheep
        - cow
        - elephant
        - bear
        - zebra
        - giraffe
    zones:
      camera_2_area:
        # Deliberate default: every part of this view counts, so no area is
        # silently unwatched. loitering_time 0 means no tracked-presence
        # requirement at all — this zone is the snapshot trigger, not a rule.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 0
        objects:
          - person
          - bird
          - cat
          - dog
          - horse
          - sheep
          - cow
          - elephant
          - bear
          - zebra
          - giraffe
    review:
      alerts:
        # Off, as on every camera. This is an internal view: no automatic
        # person retention and no risk reading of ordinary family movement here.
        enabled: false
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      required_zones:
        - camera_2_area
      retain:
        default: 0.25
    record:
      enabled: false
    live:
      streams:
        Main: camera_2_main

  camera_3:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_3_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    # detect width/height/fps are inherited from the global block above.
    objects:
      track:
        - person
        - bird
        - cat
        - dog
        - horse
        - sheep
        - cow
        - elephant
        - bear
        - zebra
        - giraffe
    zones:
      camera_3_area:
        # Deliberate default: every part of this view counts, so no area is
        # silently unwatched. loitering_time 0 means no tracked-presence
        # requirement at all — this zone is the snapshot trigger, not a rule.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 0
        objects:
          - person
          - bird
          - cat
          - dog
          - horse
          - sheep
          - cow
          - elephant
          - bear
          - zebra
          - giraffe
    review:
      alerts:
        # Off, as on every camera. Internal house view, same as camera_2.
        enabled: false
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      required_zones:
        - camera_3_area
      retain:
        default: 0.25
    record:
      enabled: false
    live:
      streams:
        Main: camera_3_main

  camera_4:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_4_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    # detect width/height/fps are inherited from the global block above.
    objects:
      track:
        - person
    zones:
      camera_4_area:
        # Deliberate default: every part of this view counts, so no area is
        # silently unwatched. loitering_time 0 means no tracked-presence
        # requirement at all — this zone is the snapshot trigger, not a rule.
        coordinates: "0,0,1,0,1,1,0,1"
        inertia: 3
        loitering_time: 0
        objects:
          - person
    review:
      alerts:
        # Off, as on every camera.
        enabled: false
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      required_zones:
        - camera_4_area
      retain:
        default: 0.25
    record:
      enabled: false
    live:
      streams:
        Main: camera_4_main