mqtt:
  enabled: false

detectors:
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

cameras:
  courtyard:
    ffmpeg:
      inputs:
        - path: "{FRIGATE_CAMERA_RTSP_URL}"
          input_args: preset-rtsp-generic
          roles:
            - detect
    detect:
      fps: 5
    objects:
      track:
        - person
    zones:
      courtyard_area:
        # Example only: redraw the courtyard boundary in the Frigate zone editor.
        coordinates: "0.30,0.35,0.70,0.35,0.70,0.85,0.30,0.85"
        inertia: 3
        loitering_time: 3
        objects:
          - person
    review:
      alerts:
        labels:
          - person
        required_zones:
          - courtyard_area
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      required_zones:
        - courtyard_area
      retain:
        default: 3
    record:
      enabled: false
