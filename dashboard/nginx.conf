# Surveillance Console — static UI, an allowlisted read view of Frigate and go2rtc,
# and one fixed write path to the retention worker.
#
# Trust boundary: the browser only ever sees the endpoint shapes below. Raw
# /api/stats is never proxied — it embeds cpu_usages.cmdline, which carries RTSP
# URLs with credentials — nor /api/config, logs, exports or writes. go2rtc is
# reachable the same way: one script, and four pinned WebSocket paths that each
# name a single main stream and no query string at all.
#
# The single exception is POST /api/snapshots/delete, the confirmed snapshot
# deletion the operator asks for. It is one exact path to one upstream worker, it
# takes a body capped at 64 k, and the worker itself re-checks origin, host,
# content type and the X-Surveillance-Action header. No generic write and no bulk
# Frigate route is reachable from the browser.
#
# Exactly one read forwards a client query string: the paginated snapshot events
# page. It goes to the retention worker — the same gateway that validates a
# delete — never to a Frigate route, and the worker bounds it to a fixed page and
# validates the camera itself. Nothing else here forwards $args at all.
#
# The upstream hosts are fixed literals, never built from request data, so a
# client cannot aim any proxy elsewhere (open proxy / SSRF). Freshness is handled
# in the browser (fetch cache:"no-store", and the live player only counts frames
# it has actually decoded), deliberately not with add_header inside a location:
# a location-level add_header would replace the whole server-level header set.

# What is allowed to reach a handler at all: reads anywhere, plus a POST to the
# one delete path and nowhere else. Every other method on every other path is
# refused with 405 before a location handler runs.
#
# The source string is the method, one space, then $uri — so "GET /index.html",
# never "GET ". The read entries must therefore be anchored regexes matched at
# the start of that string; written as literals they only ever matched an empty
# URI, which does not exist, and every GET and HEAD came back 405. Both are
# anchored at the head with no anchor at the tail on purpose: every path is a
# read. The single write stays an exact whole-string match, so it can only be
# the one canonical URI ($uri is already normalised and carries no query).
map "$request_method $uri" $method_allowed {
    default                       0;
    "~^GET\s"                     1;
    "~^HEAD\s"                    1;
    "POST /api/snapshots/delete"  1;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens      off;
    charset            utf-8;
    absolute_redirect  off;
    port_in_redirect   off;

    # No read ever needs a request body. Cap it so a write attempt cannot buffer a
    # payload even if a method guard is ever relaxed. The one delete path raises
    # its own cap to 64 k for itself and nothing else.
    client_max_body_size    1k;
    client_body_timeout     5s;
    client_header_timeout   5s;

    # Short upstream timeouts: the browser aborts first and shows honest state.
    proxy_connect_timeout   2s;
    proxy_send_timeout      4s;
    proxy_read_timeout      4s;
    proxy_redirect          off;
    proxy_http_version      1.1;

    # Security headers. Declared once, at server level, only — an add_header in
    # any location silently drops all of these. media-src allows the blob: URL
    # the live player's MediaSource is attached to; connect-src allows the
    # WebSocket the same player opens. No inline style is ever written, so
    # style-src stays 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self' blob:; connect-src 'self' websocket; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Read-only, bar the one delete path: anything the allowlist above does not
    # name is refused here, before a location handler runs.
    if ($method_allowed = "0") {
        return 405;
    }

    # Docker's embedded DNS, so a recreated frigate or retention container is
    # picked up without restarting nginx.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $frigate "frigate:5000";
    set $go2rtc  "frigate:1984";
    set $retention "retention:8090";

    # ---------------------------------------------------------------------
    # The live player. go2rtc's own bundled web component, served from the
    # copy it ships, so no second player is vendored into this page. Exact
    # match and a FIXED upstream path: the client's query string is dropped,
    # so nothing about the request can change what is returned.
    # ---------------------------------------------------------------------
    location = /video-rtc.js {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$go2rtc/video-rtc.js;
        proxy_set_header Host       $host;
        proxy_set_header Accept     */*;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Live video. Exactly four paths, one per camera, each pinned to that
    # camera's single main stream. The camera number is the only thing taken
    # from the request, and it is captured into a variable immediately:
    # $1 belongs to whichever regex was evaluated last and is not safe to
    # read further down. The capture is written ${live_camera} because nginx
    # reads a bare $live_camera_main as one unknown variable name and refuses to
    # start; the braces end the name so _main is literal text.
    #
    # The query string is written out in full here, so the client's own is
    # never forwarded. Nothing a client appends can ask go2rtc for its config,
    # swap in another stream, or widen the request.
    #
    # A WebSocket needs the HTTP/1.1 upgrade headers and must not be cut off by
    # the 4 s read timeout set for the JSON reads above.
    # ---------------------------------------------------------------------
    location ~ "^/live/camera_([1-4])$" {
        limit_except GET {
            deny all;
        }
        set $live_camera $1;
        proxy_pass http://$go2rtc/api/ws?src=camera_${live_camera}_main;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout           1h;
    }

    # Any other /live path is not a camera: no generic path, no wildcard.
    location /live/ {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Status. FIXED upstream URI, FIXED key allowlist, ALL client query
    # arguments discarded.
    #
    # /api/stats/history returns the same stat shapes as /api/stats filtered to
    # requested dot-notation keys, so cpu_usages and its cmdline never leave the
    # container. The keys are pinned here and the client's $is_args$args is
    # deliberately absent, so ?keys=cpu_usages cannot reach the upstream.
    # ---------------------------------------------------------------------
    location = /api/stats {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate/api/stats/history?keys=cameras.camera_fps,cameras.process_fps,cameras.detection_enabled,detectors.inference_speed,service.last_updated;
        proxy_set_header Host       $host;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Design tokens are mounted outside the docroot, so this is the only way
    # they reach the browser. Exact match: nothing else exposes that file.
    # ---------------------------------------------------------------------
    location = /tokens.css {
        alias /etc/nginx/zone-tokens.css;
    }

    # The real copy of this file is mounted at /etc/nginx/conf.d/default.conf,
    # not in the docroot, but a document root is static and this name is worth
    # refusing by name rather than relying on where the file happens to sit.
    location = /nginx.conf {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Events. FIXED, BOUNDED upstream URI; ALL client query arguments
    # discarded. The upstream is already the whole four-camera person payload
    # the page needs (50 rows, snapshot-bearing, in any required zone), so the
    # browser has nothing left to widen, and camera/zone selection is a
    # client-side re-slice of one read.
    # ---------------------------------------------------------------------
    location = /api/events {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate/api/events?labels=person&has_snapshot=1&limit=50&cameras=camera_1,camera_2,camera_3,camera_4&zones=camera_1_area,camera_2_area,camera_3_area,camera_4_area;
        proxy_set_header Host       $host;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # Frigate's tracker id is "<frame_time>-<rand_id>": an epoch timestamp with
    # an optional decimal, a hyphen, then 6 lowercase alphanumerics — e.g.
    # 1790910000.123456-abc123. The pattern is quoted because an unquoted {...}
    # quantifier is read by the nginx config parser as a block, not as regex.
    # Fully anchored, so no traversal or extra path segment can match.
    location ~ "^/api/events/[0-9]+(\.[0-9]+)?-[a-z0-9]{6}/snapshot\.jpg$" {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate$request_uri;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Latest-frame previews, one shape per configured camera.
    # ---------------------------------------------------------------------
    location ~ "^/api/camera_[1-4]/latest\.jpg$" {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate$request_uri;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Snapshot review. Three exact paths on the retention worker, which is the
    # only upstream here that is neither Frigate nor go2rtc:
    #
    #   GET  /api/snapshots/summary -> {count, before}
    #   GET  /api/snapshots/events  -> {events, page, page_size, total, pages}
    #   POST /api/snapshots/delete  -> {"ids":[...]} or {"all":true,"before":...}
    #
    # All three take a FIXED upstream path, so nothing appended to the path can
    # change what is asked for. The scope of a delete is decided by the worker
    # from the body alone: there is no query parameter on the write.
    #
    # Host is forwarded as $http_host, not $host, because the dashboard is
    # published on 127.0.0.1:8088 and the worker checks Host: without the port
    # that check could never match the browser's own request.
    # ---------------------------------------------------------------------
    location = /api/snapshots/summary {
        limit_except GET {
            deny all;
        }
        # Counting the archive is a bounded walk of the same kind a delete
        # performs, so it gets the same 60 s the delete gets. Short JSON reads
        # keep the 4 s server default.
        proxy_read_timeout      60s;
        proxy_pass http://$retention/api/snapshots/summary;
        proxy_set_header Host       $http_host;
        proxy_set_header Origin     $http_origin;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # One page of the review archive. GET and HEAD only, exact path, no
    # wildcard behind it.
    #
    # This is the one read that forwards a client query, and it is forwarded to
    # the validating local gateway: $is_args$args appends the browser's own
    # arguments to a fixed upstream path, so no argument can redirect the
    # request, and the arguments land on the worker, never on raw Frigate. The
    # worker owns the rest — a fixed 25 rows per page, and ?page and ?camera
    # validated strictly before the archive is touched, with all four cameras
    # and "all" accepted and anything else answered 400. A client therefore
    # cannot widen this into an archive sweep; the widest read is one page.
    #
    # It is a bounded archive walk like the delete, so it is given the same 60 s
    # rather than the 4 s the live reads use.
    #
    # No CORS in either direction: this emits no Access-Control-* header, and
    # any the worker sends is dropped on the way back, so the response is only
    # readable by a page this server itself served. A cross-origin preflight
    # never gets that far — OPTIONS is not in the method allowlist above, so it
    # is answered 405 before this location is selected.
    # ---------------------------------------------------------------------
    location = /api/snapshots/events {
        limit_except GET {
            deny all;
        }
        proxy_read_timeout      60s;
        proxy_pass http://$retention/api/snapshots/events$is_args$args;
        proxy_set_header Host       $http_host;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    location = /api/snapshots/delete {
        # POST only. GET and HEAD are allowed past the server-level allowlist so
        # they can be answered with 405 here rather than reaching the worker.
        if ($request_method != "POST") {
            return 405;
        }
        # The only path that accepts a body at all, and only this much of it: a
        # list of tracker ids is bounded by the rows the page can show. The
        # 1 k server-level cap stays in force for every other path.
        client_max_body_size    64k;
        # The worker answers 60 s or not at all, which is the same window the
        # browser waits: a slow delete is reported rather than cut off halfway.
        proxy_read_timeout      60s;
        proxy_pass http://$retention/api/snapshots/delete;
        # Origin and the action header are passed exactly as the browser sent
        # them, and nginx invents neither: each is empty when the client omits
        # it, and the worker refuses a request that arrives without one.
        proxy_set_header Host                   $http_host;
        proxy_set_header Origin                 $http_origin;
        proxy_set_header Content-Type           $http_content_type;
        proxy_set_header X-Surveillance-Action  $http_x_surveillance_action;
        proxy_set_header Accept                 application/json;
        proxy_set_header Connection             "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Everything else under /api is denied: raw stats, the arbitrary
    # stats/history surface, config, logs, exports, recordings, every snapshot
    # path but the three above — including any sub-path of the paginated events
    # read, which is an exact match — Frigate's own event writes and
    # retain/delete routes, restart, and every other Frigate route.
    # ---------------------------------------------------------------------
    location /api/ {
        return 404;
    }

    # No dotfile exists in this docroot; refuse without touching disk.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
