# Zone Console — static UI plus a read-only, allowlisted view of Frigate.
#
# Trust boundary: the browser only ever sees the endpoint shapes below, via GET
# or HEAD. Raw /api/stats is never proxied — it embeds cpu_usages.cmdline, which
# carries RTSP URLs with credentials — nor /api/config, logs, exports or writes.
#
# The upstream host is a fixed literal, never built from request data, so a
# client cannot aim the proxy elsewhere (open proxy / SSRF). Freshness is
# handled in the browser (cache-busted image URLs, fetch cache:"no-store"),
# deliberately not with add_header inside a location: a location-level
# add_header would replace the whole server-level header set.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens      off;
    charset            utf-8;
    absolute_redirect  off;
    port_in_redirect   off;

    # No request body is ever needed. Cap it so a write attempt cannot buffer a
    # payload even if a method guard is ever relaxed.
    client_max_body_size    1k;
    client_body_timeout     5s;
    client_header_timeout   5s;

    # Short upstream timeouts: the browser aborts first and shows honest state.
    proxy_connect_timeout   2s;
    proxy_send_timeout      4s;
    proxy_read_timeout      4s;
    proxy_redirect          off;
    proxy_http_version      1.1;

    # Security headers. Declared once, at server level, only — an add_header in
    # any location silently drops all of these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Read-only. Anything that is not GET or HEAD is refused before a location
    # handler runs.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Docker's embedded DNS, so a recreated frigate container is picked up
    # without restarting nginx.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $frigate "frigate:5000";

    # ---------------------------------------------------------------------
    # Status. FIXED upstream URI, FIXED key allowlist, ALL client query
    # arguments discarded.
    #
    # /api/stats/history returns the same stat shapes as /api/stats filtered to
    # requested dot-notation keys, so cpu_usages and its cmdline never leave the
    # container. The keys are pinned here and the client's $is_args$args is
    # deliberately absent, so ?keys=cpu_usages cannot reach the upstream.
    # ---------------------------------------------------------------------
    location = /api/stats {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate/api/stats/history?keys=cameras.camera_fps,cameras.process_fps,cameras.detection_enabled,detectors.inference_speed,service.last_updated;
        proxy_set_header Host       $host;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Design tokens are mounted outside the docroot, so this is the only way
    # they reach the browser. Exact match: nothing else exposes that file.
    # ---------------------------------------------------------------------
    location = /tokens.css {
        alias /etc/nginx/zone-tokens.css;
    }

    # The real copy of this file is mounted at /etc/nginx/conf.d/default.conf,
    # not in the docroot, but a document root is static and this name is worth
    # refusing by name rather than relying on where the file happens to sit.
    location = /nginx.conf {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Events. FIXED, BOUNDED upstream URI; ALL client query arguments
    # discarded. The upstream is already the whole four-camera person payload
    # the page needs (50 rows, snapshot-bearing, in any required zone), so the
    # browser has nothing left to widen, and camera/zone selection is a
    # client-side re-slice of one read.
    # ---------------------------------------------------------------------
    location = /api/events {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate/api/events?labels=person&has_snapshot=1&limit=50&cameras=camera_1,camera_2,camera_3,camera_4&zones=camera_1_area,camera_2_area,camera_3_area,camera_4_area;
        proxy_set_header Host       $host;
        proxy_set_header Accept     application/json;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # Frigate's tracker id is "<frame_time>-<rand_id>": an epoch timestamp with
    # an optional decimal, a hyphen, then 6 lowercase alphanumerics — e.g.
    # 1790910000.123456-abc123. The pattern is quoted because an unquoted {...}
    # quantifier is read by the nginx config parser as a block, not as regex.
    # Fully anchored, so no traversal or extra path segment can match.
    location ~ "^/api/events/[0-9]+(\.[0-9]+)?-[a-z0-9]{6}/snapshot\.jpg$" {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate$request_uri;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Latest-frame previews, one shape per configured camera.
    # ---------------------------------------------------------------------
    location ~ "^/api/camera_[1-4]/latest\.jpg$" {
        limit_except GET {
            deny all;
        }
        proxy_pass http://$frigate$request_uri;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        proxy_hide_header Set-Cookie;
    }

    # ---------------------------------------------------------------------
    # Everything else under /api is denied: raw stats, the arbitrary
    # stats/history surface, config, logs, exports, recordings, review writes,
    # restart, and every other Frigate route.
    # ---------------------------------------------------------------------
    location /api/ {
        return 404;
    }

    # No dotfile exists in this docroot; refuse without touching disk.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
