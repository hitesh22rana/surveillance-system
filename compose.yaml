services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000
    # Native, authenticated Frigate UI. Loopback only. Port 5000 (the API this
    # stack proxies) is deliberately never published.
    ports:
      - "127.0.0.1:8971:8971"

  dashboard:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - frigate
    volumes:
      # Static UI, read-only. The docroot is read-only, so nothing can be written
      # into it: a nested mountpoint there would not exist and the mount fails.
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Design tokens stay canonical at the repository root and are mounted
      # outside the docroot, then served by one exact /tokens.css alias.
      - ./tokens.css:/etc/nginx/zone-tokens.css:ro
    # Loopback only, and read-only by proxy policy apart from the two controlled
    # snapshot paths and the entry arming path it forwards to the retention gateway:
    # the UI itself needs no authentication, so it must never be reachable from the
    # network.
    ports:
      - "127.0.0.1:8088:80"
    # No default network exposure beyond the two loopback mappings above.
    security_opt:
      - no-new-privileges:true

  # Retention worker. Pins the person events that entered a camera's own armed
  # restricted area (cameras 1 and 4 only, armed by hand from the dashboard) and any
  # animal seen on sight, so Frigate's snapshot pruning cannot take them first. It
  # also serves the dashboard's two controlled writes: reviewed manual deletion and
  # entry arming. Standard library only, so the image is the bare interpreter:
  # nothing to install, nothing to audit.
  retention:
    image: python:3.13-alpine
    restart: unless-stopped
    depends_on:
      - frigate
    # The worker is one read-only file. It writes nothing and needs nothing but
    # the internal API, which is a literal default rather than an injected value.
    read_only: true
    volumes:
      - ./scripts/retain.py:/app/retain.py:ro
    # The interpreter has nothing to put in /tmp, so this tmpfs stays empty. It is
    # here because read_only turns any stray write into a crash, and a worker that
    # crash-loops behind a read-only filesystem retains nothing at all.
    tmpfs:
      - /tmp
    # --serve runs the 30 second poll loop and the gateway in one process,
    # sharing one lock. The gateway listens on 8090 on the internal network, where
    # nginx reaches it as retention:8090 to answer the dashboard's three snapshot
    # paths and the entry arming route. It refuses anything whose Host is not the
    # dashboard's published address, so this port is not an entry point on its own.
    command: ["python3", "-u", "/app/retain.py", "--serve", "--api-base", "http://frigate:5000"]
    # No ports and no env_file: it holds no camera credential, and the only
    # upstreams it can reach are Frigate's internal API, which compose never
    # publishes, and its own loopback listener. Keep it that way — nothing here may
    # ever hold a .env value, and nothing here may ever publish a port.
    security_opt:
      - no-new-privileges:true
