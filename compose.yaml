services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000
    # Native, authenticated Frigate UI. Loopback only. Port 5000 (the API this
    # stack proxies) is deliberately never published.
    ports:
      - "127.0.0.1:8971:8971"

  dashboard:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - frigate
    volumes:
      # Static UI, read-only. The docroot is read-only, so nothing can be written
      # into it: a nested mountpoint there would not exist and the mount fails.
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Design tokens stay canonical at the repository root and are mounted
      # outside the docroot, then served by one exact /tokens.css alias.
      - ./tokens.css:/etc/nginx/zone-tokens.css:ro
    # Loopback only, and read-only by proxy policy apart from the two controlled
    # snapshot paths and the entry arming path it forwards to the retention gateway:
    # the UI itself needs no authentication, so it must never be reachable from the
    # network.
    ports:
      - "127.0.0.1:8088:80"
    # No default network exposure beyond the two loopback mappings above.
    security_opt:
      - no-new-privileges:true

  # Retention worker. Pins the person events that came inside a camera's own watched
  # area - camera_4 always, cameras 1-3 while a person has armed them from the dashboard -
  # and any animal seen on sight, so Frigate's snapshot pruning cannot take them first. It
  # also serves the dashboard's two controlled writes: reviewed manual deletion and
  # entry review. Standard library only, so the image is the bare interpreter: nothing to
  # install, nothing to audit.
  retention:
    image: python:3.13-alpine
    restart: unless-stopped
    depends_on:
      - frigate
    # The worker is one read-only file. Its root filesystem stays read-only, and the one
    # thing it writes is the operator's arming, in the named volume below.
    read_only: true
    volumes:
      - ./scripts/retain.py:/app/retain.py:ro
      # The only writable path in the container: entry.json holds three arming flags and
      # three timestamps, so a restart comes back as the operator left it. A named volume
      # rather than a bind mount, so no host path is written into this project.
      - retention-state:/state
    # The interpreter has nothing to put in /tmp, so this tmpfs stays empty. It is
    # here because read_only turns any stray write into a crash, and a worker that
    # crash-loops behind a read-only filesystem retains nothing at all.
    tmpfs:
      - /tmp
    # --serve runs the 30 second poll loop and the gateway in one process,
    # sharing one lock. The gateway listens on 8090 on the internal network, where
    # nginx reaches it as retention:8090 to answer the dashboard's three snapshot
    # paths and the entry arming route. It refuses anything whose Host is not the
    # dashboard's published address, so this port is not an entry point on its own.
    command: ["python3", "-u", "/app/retain.py", "--serve", "--api-base", "http://frigate:5000"]
    # No ports and no env_file: it holds no camera credential, and the only
    # upstreams it can reach are Frigate's internal API, which compose never
    # publishes, and its own loopback listener. Keep it that way - nothing here may
    # ever hold a .env value, and nothing here may ever publish a port.
    security_opt:
      - no-new-privileges:true

  # Experimental, and separate from everything above: cameras 2 and 3 only, running
  # whatever anybody has armed, so Home and Away do not reach it and no file can
  # switch it off. It looks at the whole frame of those two rooms three times a
  # second in memory and asks one small local VideoMAE classifier whether a 16 frame
  # clip looks violent. Two consecutive windows above the threshold label the person
  # events overlapping that interval possible_fighting and pin them, exactly as the
  # retention worker pins, so the archive and the operator's own deletion path see
  # these snapshots like any other. It can only add: no DELETE, no un-pin, no
  # configuration change, no synthetic event. docs/fighting.md says what it cannot do.
  fighting:
    build:
      context: .
      dockerfile: Dockerfile.fighting
    image: surveillance-fighting:local
    restart: unless-stopped
    depends_on:
      - frigate
    # The worker's root filesystem stays read-only and every capability is dropped.
    # The only thing it writes is its pending intervals, in the named volume below.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # One model on two CPU threads, scored every 5.3 seconds per camera. Anything
    # slower than this falls behind its own capture rate and drops windows rather
    # than growing, so this is a ceiling rather than a reservation.
    cpus: 2
    mem_limit: 2g
    volumes:
      # The model, read-only, mounted from a directory that is not in Git and that
      # root provisions once. Nothing is downloaded at runtime, ever.
      - ./.models/fighting:/models/fighting:ro
      # Candidate intervals waiting to be matched: a camera, four numbers and the
      # version, forty rows at most. No frame, no event id, no credential.
      - fighting-state:/state
    # The interpreter and torch both want a scratch directory; this tmpfs is the
    # only writable path besides /state.
    tmpfs:
      - /tmp
    # No ports and no env_file: it holds no camera credential, and the only upstreams
    # it can reach are Frigate's internal API, which compose never publishes, and its
    # own loopback listener, which nginx reaches as fighting:8091 on the internal
    # network and nothing else can.
    command: ["python3", "-u", "/app/fighting.py", "--api-base", "http://frigate:5000",
              "--model-dir", "/models/fighting", "--listen", "0.0.0.0:8091"]

volumes:
  # The retention worker's arming, nothing else.
  retention-state:

  # The fighting worker's candidate intervals waiting to be matched, nothing else.
  fighting-state:
