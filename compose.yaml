services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ./storage:/media/frigate
    tmpfs:
      - /tmp/cache:size=1000000000
    ports:
      - "127.0.0.1:8971:8971"
